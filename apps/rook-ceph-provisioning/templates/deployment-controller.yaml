{{- if .Values.enabled }}
{{- $controllerName := include "helm.componentName" ( dict "root" . "component" "controller" ) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $controllerName | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
{{- include "helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
{{- include "helm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      annotations:
{{- with .Values.controller.podAnnotations }}
{{- toYaml . | nindent 8 }}
{{- end }}
      labels:
{{- include "helm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ $controllerName | quote }}
      automountServiceAccountToken: true
{{- with .Values.controller.priorityClassName }}
      priorityClassName: {{ . | quote }}
{{- end }}
{{- with .Values.controller.affinity }}
      affinity:
{{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.controller.nodeSelector }}
      nodeSelector:
{{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.controller.tolerations }}
      tolerations:
{{- toYaml . | nindent 8 }}
{{- end }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: "{{ .Values.image.repo }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          command:
            - /usr/local/bin/openark-rook-ceph-controller
          env:
            - name: PROVISIONING_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CEPH_CLUSTER_NAMESPACE
              value: {{ .Values.rookNamespace | quote }}
            - name: ROOK_DISCOVERY_NAMESPACE
              value: {{ .Values.rookNamespace | quote }}
            - name: APP_INSTANCE
              value: {{ .Release.Name | quote }}
            - name: STORAGE_ROLE_LABEL
              value: {{ .Values.storageRoleLabel.key | quote }}
            - name: STORAGE_ROLE_VALUE
              value: {{ .Values.storageRoleLabel.value | quote }}
            - name: DEVICE_CLASS_MAP
              value: {{ .Values.deviceClassMap | toJson | quote }}
            - name: POLL_INTERVAL_SECONDS
              value: {{ .Values.controller.intervalSeconds | quote }}
            - name: INVENTORY_MAX_AGE_SECONDS
              value: {{ .Values.controller.maxInventoryAgeSeconds | quote }}
            - name: MINIMUM_DEVICE_BYTES
              value: {{ .Values.controller.minSizeBytes | quote }}
            - name: CEPH_CLUSTER_NAME
              value: {{ .Values.cephClusterName | quote }}
            - name: OSDS_PER_DEVICE
              value: {{ .Values.osdsPerDevice | quote }}
            - name: DRY_RUN
              value: {{ .Values.controller.dryRun | toString | quote }}
          resources:
{{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
