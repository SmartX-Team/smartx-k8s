{{- if .Values.enabled }}
{{- $agentName := include "helm.componentName" ( dict "root" . "component" "agent" ) }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $agentName | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
{{- include "helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
{{- include "helm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      annotations:
{{- with .Values.agent.podAnnotations }}
{{- toYaml . | nindent 8 }}
{{- end }}
      labels:
{{- include "helm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: {{ $agentName | quote }}
      automountServiceAccountToken: true
{{- with .Values.agent.priorityClassName }}
      priorityClassName: {{ . | quote }}
{{- end }}
      nodeSelector:
        {{ .Values.storageRoleLabel.key | quote }}: {{ .Values.storageRoleLabel.value | quote }}
{{- with .Values.agent.tolerations }}
      tolerations:
{{- toYaml . | nindent 8 }}
{{- end }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: "{{ .Values.image.repo }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          command:
            - /usr/local/bin/openark-rook-ceph-agent
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: APP_INSTANCE
              value: {{ .Release.Name | quote }}
            - name: INVENTORY_INTERVAL_SECONDS
              value: {{ .Values.agent.intervalSeconds | quote }}
            - name: HOST_SYS_ROOT
              value: /host/sys
            - name: HOST_DEV_ROOT
              value: /host/dev
          resources:
{{- toYaml .Values.agent.resources | nindent 12 }}
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: host-sys
              mountPath: /host/sys
              readOnly: true
            - name: host-dev
              mountPath: /host/dev
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
        - name: host-dev
          hostPath:
            path: /dev
            type: Directory
        - name: tmp
          emptyDir: {}
{{- end }}
