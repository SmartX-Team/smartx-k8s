---
# This chart renders no runtime resources until the implementation repository
# explicitly enables provisioning through:
#
# rookCeph:
#   provisioning:
#     manageStorageNodes: true
#     enabled: true
enabled: false

image:
  repo: quay.io/ulagbulag/openark
  tag: ""
  pullPolicy: Always

rookNamespace: csi-rook-ceph
cephClusterName: rook-ceph-cluster

storageRoleLabel:
  key: node-role.kubernetes.io/kiss
  value: Storage

agent:
  intervalSeconds: 60
  podAnnotations: {}
  priorityClassName: ""
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  tolerations:
    - effect: NoExecute
      operator: Exists
    - effect: NoSchedule
      operator: Exists

controller:
  intervalSeconds: 30
  maxInventoryAgeSeconds: 300
  minSizeBytes: 0
  # Validate proposed CephCluster patches without persisting them until the
  # cluster-specific policy explicitly enables writes.
  dryRun: true
  podAnnotations: {}
  priorityClassName: ""
  affinity: {}
  nodeSelector: {}
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  tolerations: []

osdsPerDevice: "1"

# Exact normalized hardware classes take precedence over media-level fallbacks.
# A child implementation repository can add entries such as:
#
# deviceClassMap:
#   hdd: capacity-tier
#   nvme-pcie-32gt: standard-tier
#   nvme-pcie-64gt: performance-tier
deviceClassMap:
  hdd: hdd
  nvme: nvme
  ssd: ssd
