---
# Operator configuration section
operatorConfig:
  driverSpecDefaults:
    # Node Plugin Configuration
    nodePlugin:
      # -- List of tolerations for the pod (default: [])
      tolerations:
        - key: {{ index .Values.openark.labels "org.ulagbulag.io/bind" | quote }}
          operator: Exists
          effect: NoExecute
        - key: {{ index .Values.openark.labels "org.ulagbulag.io/bind.profile" | quote }}
          operator: Exists
          effect: NoExecute
        - key: {{ index .Values.openark.labels "org.ulagbulag.io/signed-out" | quote }}
          operator: Exists
          effect: NoExecute

# Drivers configuration
drivers:
  # RBD driver configuration
  rbd:
    # Node Plugin Configuration
    nodePlugin:
      # -- List of tolerations for the pod (default: [])
      tolerations:
        - key: {{ index .Values.openark.labels "org.ulagbulag.io/bind" | quote }}
          operator: Exists
          effect: NoExecute
        - key: {{ index .Values.openark.labels "org.ulagbulag.io/bind.profile" | quote }}
          operator: Exists
          effect: NoExecute
        - key: {{ index .Values.openark.labels "org.ulagbulag.io/signed-out" | quote }}
          operator: Exists
          effect: NoExecute

  # NVMe-oF driver configuration (backed by RBD)
  nvmeof:
    # Node Plugin Configuration
    nodePlugin:
      # -- List of tolerations for the pod (default: [])
      tolerations:
        - key: {{ index .Values.openark.labels "org.ulagbulag.io/bind" | quote }}
          operator: Exists
          effect: NoExecute
        - key: {{ index .Values.openark.labels "org.ulagbulag.io/bind.profile" | quote }}
          operator: Exists
          effect: NoExecute
        - key: {{ index .Values.openark.labels "org.ulagbulag.io/signed-out" | quote }}
          operator: Exists
          effect: NoExecute

  # CephFS driver configuration
  cephfs:
    # Node Plugin Configuration
    nodePlugin:
      # -- List of tolerations for the pod (default: [])
      tolerations:
        - key: {{ index .Values.openark.labels "org.ulagbulag.io/bind" | quote }}
          operator: Exists
          effect: NoExecute
        - key: {{ index .Values.openark.labels "org.ulagbulag.io/bind.profile" | quote }}
          operator: Exists
          effect: NoExecute
        - key: {{ index .Values.openark.labels "org.ulagbulag.io/signed-out" | quote }}
          operator: Exists
          effect: NoExecute

  # NFS driver configuration
  nfs:
    # Node Plugin Configuration
    nodePlugin:
      # -- List of tolerations for the pod (default: [])
      tolerations:
        - key: {{ index .Values.openark.labels "org.ulagbulag.io/bind" | quote }}
          operator: Exists
          effect: NoExecute
        - key: {{ index .Values.openark.labels "org.ulagbulag.io/bind.profile" | quote }}
          operator: Exists
          effect: NoExecute
        - key: {{ index .Values.openark.labels "org.ulagbulag.io/signed-out" | quote }}
          operator: Exists
          effect: NoExecute
