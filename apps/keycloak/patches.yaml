---
smartx:
  auth:
    domainName: {{ .Values.auth.domainName | quote }}
  ingress:
    domainName: {{ .Values.ingress.domainName | quote }}
    enabled: {{ has "org.ulagbulag.io/ingress" .Values.features }}

## @param clusterDomain Default Kubernetes cluster domain
##
clusterDomain: {{ .Values.cluster.domainName | quote }}

## Keycloak authentication parameters
## ref: https://github.com/bitnami/containers/tree/main/bitnami/keycloak#admin-credentials
##
auth:
  ## @param auth.adminUser Keycloak administrator user
  ##
  adminUser: {{ .Values.cluster.name | quote }}

## Deploy the login theme and restart Keycloak when the packaged theme changes.
##
extraVolumes:
  - name: login-theme-smartx
    configMap:
      name: keycloak-login-theme-smartx
      defaultMode: 0444
      items:
        - key: login.css
          path: login/resources/css/login.css
        - key: login.ftl
          path: login/login.ftl
        - key: logo.svg
          path: login/resources/img/logo.svg
        - key: theme.properties
          path: login/theme.properties
extraVolumeMounts:
  - name: login-theme-smartx
    mountPath: /opt/bitnami/keycloak/themes/smartx
    readOnly: true

## Apply the theme to the admin realm and the configured user realm.
##
keycloakConfigCli:
  enabled: true
  image:
    repository: adorsys/keycloak-config-cli
    tag: "6.5.1-21"
    pullPolicy: IfNotPresent
  configuration:
    smartx-master-theme.yaml: |-
      realm: master
      loginTheme: smartx
{{- if and .Values.auth.realms.name ( ne .Values.auth.realms.name "master" ) }}
    smartx-user-theme.yaml: |-
      realm: {{ .Values.auth.realms.name | quote }}
      loginTheme: smartx
{{- end }}

## Keycloak ingress parameters
## ref: https://kubernetes.io/docs/concepts/services-networking/ingress/
##
ingress:
  ## @param ingress.ingressClassName IngressClass that will be be used to implement the Ingress (Kubernetes 1.18+)
  ## This is supported in Kubernetes 1.18+ and required if you have more than one IngressClass marked as the default for your cluster .
  ## ref: https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/
  ##
  ingressClassName: {{ .Values.ingress.domainName | quote }}
  ## @param ingress.hostname Default host for the ingress record (evaluated as template)
  ##
  hostname: {{ .Values.auth.domainName | quote }}
  ## @param ingress.annotations [object] Additional annotations for the Ingress resource. To enable certificate autogeneration, place here your cert-manager annotations.
  ## Use this parameter to set the required annotations for cert-manager, see
  ## ref: https://cert-manager.io/docs/usage/ingress/#supported-annotations
  ## e.g:
  ## annotations:
  ##   kubernetes.io/ingress.class: nginx
  ##   cert-manager.io/cluster-issuer: cluster-issuer-name
  ##
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.domainName | quote }}

## Metrics configuration
##
metrics:
  ## @param metrics.enabled Enable exposing Keycloak statistics
  ## ref: https://github.com/bitnami/containers/tree/main/bitnami/keycloak#enabling-statistics
  ##
  enabled: {{ has "org.ulagbulag.io/monitoring" .Values.features }}
  ## Prometheus Operator ServiceMonitor configuration
  ##
  serviceMonitor:
    ## @param metrics.serviceMonitor.enabled Create ServiceMonitor Resource for scraping metrics using PrometheusOperator
    ##
    enabled: {{ has "org.ulagbulag.io/monitoring" .Values.features }}
  ## Prometheus Operator alert rules configuration
  ##
  prometheusRule:
    ## @param metrics.prometheusRule.enabled Create PrometheusRule Resource for scraping metrics using PrometheusOperator
    ##
    enabled: {{ has "org.ulagbulag.io/observability" .Values.features }}
