{{- $defaults := tpl ( $.Files.Get "apps/rook-ceph-cluster/defaults.yaml" ) $ | fromYaml | default dict -}}
{{- $rookCeph := .Values.rookCeph | default dict -}}
{{- $provisioning := get $rookCeph "provisioning" | default dict -}}
{{- $provisioningManaged := get $provisioning "manageStorageNodes" | default false -}}
{{- if and
  ( get $provisioning "enabled" | default false )
  ( not $provisioningManaged )
-}}
{{- fail "rookCeph.provisioning.enabled requires manageStorageNodes=true" -}}
{{- end -}}

{{- /*
Cluster-specific topology and Ceph policy are supplied only through the
top-level rookCeph.cluster map. Keeping one policy input avoids conflicting
Helm value precedence between valuesObject and child value files.
*/ -}}
{{- $overrides := get $rookCeph "cluster" | default dict -}}
{{- if not ( kindIs "map" $overrides ) -}}
{{- fail ".Values.rookCeph.cluster must be a map" -}}
{{- end -}}

{{- $merged := mergeOverwrite ( deepCopy $defaults ) $overrides -}}

{{- /*
Automatic provisioning requires exclusive ownership of the explicit
storage.nodes inventory. Apply these invariants after cluster policy overrides
so a child repository cannot accidentally re-enable Rook's broad node or
device selection while provisioning owns the inventory. Disabling the runtime
while retaining manageStorageNodes freezes the last explicit inventory;
clearing manageStorageNodes is an explicit handoff to declarative policy.

Static storage.nodes entries cannot be combined with runtime ownership.
*/ -}}
{{- if $provisioningManaged -}}
{{- $cephClusterSpec := get $merged "cephClusterSpec" | default dict -}}
{{- $storage := get $cephClusterSpec "storage" | default dict -}}
{{- if or
  ( get $storage "useAllNodes" | default false )
  ( get $storage "useAllDevices" | default false )
  ( not ( empty ( get $storage "deviceFilter" ) ) )
  ( not ( empty ( get $storage "devicePathFilter" ) ) )
  ( not ( empty ( get $storage "devices" ) ) )
-}}
{{- fail "runtime-managed storage cannot use cluster-level node or device selectors" -}}
{{- end -}}
{{- if and ( hasKey $storage "nodes" ) ( not ( empty ( get $storage "nodes" ) ) ) -}}
{{- fail "rookCeph.cluster.cephClusterSpec.storage.nodes must be empty while the provisioning feature owns the inventory" -}}
{{- end -}}
{{- $_ := set $storage "useAllNodes" false -}}
{{- $_ := set $storage "useAllDevices" false -}}
{{- $_ := set $storage "nodes" list -}}
{{- $_ := set $cephClusterSpec "storage" $storage -}}
{{- $_ := set $merged "cephClusterSpec" $cephClusterSpec -}}
{{- end -}}

{{ $merged | toYaml }}
