{{- $rookCeph := .Values.rookCeph | default dict -}}
{{- $provisioning := get $rookCeph "provisioning" | default dict -}}
{{- $provisioningManaged := get $provisioning "manageStorageNodes" | default false -}}
{{- if and
  ( get $provisioning "enabled" | default false )
  ( not $provisioningManaged )
-}}
{{- fail "rookCeph.provisioning.enabled requires manageStorageNodes=true" -}}
{{- end -}}
---
appVersion: org.ulagbulag.io/v1alpha1
kind: Manifest
metadata:
  name: smartx.apps.rook-ceph-cluster
spec:
  group: ops
  phase: stable
  scale: small
  users:
    owners:
      - Ho Kim <ho.kim@smartx.kr>
  app:
    autoSync: true
    namespace: csi-rook-ceph
    patched: false
    unsafe: true # CSI
    useClusterValues: false
    features:
      - org.ulagbulag.io/csi
      - org.ulagbulag.io/distributed-storage-cluster/ceph
      - org.ulagbulag.io/ingress
    ignoreDifferences:
{{ if $provisioningManaged }}
      - group: ceph.rook.io
        kind: CephCluster
        jsonPointers:
          - /spec/storage/nodes
{{ else }}
      []
{{ end }}
    sync:
      createNamespace: false
      respectIgnoreDifferences: true
      serverSideApply: true
  source:
    chart: rook-ceph-cluster
    repoUrl: "https://charts.rook.io/release"
    version: v1.19.8
